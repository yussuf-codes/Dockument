services:
  frontend:
    image: dockument-frontend:local
    build:
      context: ./dockument-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5001}
    ports:
      - "80:80"
  backend:
    image: dockument-backend:local
    build:
      context: ./dockument-backend
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

